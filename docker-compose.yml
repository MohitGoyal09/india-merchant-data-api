# One image, one volume. `api` serves reads; `worker` keeps the data fresh and delivers
# webhooks. `backfill` is a one-shot: docker compose --profile tools run --rm backfill
# `mcp` serves the MCP connector over HTTP: IMDA_MCP_TOKEN=... docker compose --profile mcp up -d mcp
# Containers never restart on their own (restart: "no"), so nothing starts when Docker opens.
x-imda: &imda
  image: imda:dev
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    IMDA_DB_PATH: /data/imda.sqlite3
  volumes:
    - imda-data:/data
  restart: "no"

services:
  api:
    <<: *imda
    command: ["imda", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${IMDA_API_PORT:-8000}:8000"  # override if 8000 is taken

  worker:
    <<: *imda
    command: ["imda", "worker"]
    healthcheck:
      disable: true  # the image check probes the API port; the worker serves none

  backfill:
    <<: *imda
    profiles: ["tools"]
    restart: "no"
    healthcheck:
      disable: true
    command: ["imda", "backfill", "--from", "2024-01-01"]

  mcp:
    <<: *imda
    profiles: ["mcp"]
    environment:
      IMDA_DB_PATH: /data/imda.sqlite3
      IMDA_MCP_TOKEN: ${IMDA_MCP_TOKEN:-}  # required: `imda mcp --transport http` exits 2 without it
    command: ["imda", "mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8100",
              "--allowed-host", "127.0.0.1:8100", "--allowed-host", "localhost:8100"]
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      disable: true  # the image check probes the API port; the MCP service listens on 8100

volumes:
  imda-data:
