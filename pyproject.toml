[project]
name = "india-merchant-data-api"
version = "0.1.0"
description = "Reverse-engineered RBI + FBIL public data as a typed REST API: FX time series, bank holidays, settlement ETA."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mohit Goyal" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "mcp>=2.2,<3",
]

[project.scripts]
imda = "imda.cli:app"

[project.optional-dependencies]
agent = [
    "anthropic>=1.11,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "anthropic>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imda"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["imda"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: hits real RBI/FBIL endpoints (opt-in via `make test-live`)"]

[tool.coverage.run]
source = ["imda"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
