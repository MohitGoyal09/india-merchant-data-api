name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --quiet
      - run: make check
      - run: uv run python scripts/export_tool_spec.py --check

  # Keyless: starts `imda mcp` over stdio on the fixture DB and runs the asserted checks.
  demo-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --quiet
      - run: uv run python scripts/demo_mcp.py

  # The named API cases against a fixture DB, in process.
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --quiet
      - run: make cases

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --quiet
      # Medium and high severity findings fail the job.
      - run: uv run bandit -r src -q -ll
      # Known vulnerabilities in the installed dependencies fail the job.
      - run: uv run pip-audit

  # Builds the image and probes api + mcp under an isolated compose project.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --quiet
      - run: bash scripts/smoke_compose.sh
